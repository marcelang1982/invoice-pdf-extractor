<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoice Extractor{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Invoice&nbsp;Extractor</a>
    <nav>
      <a href="/" class="{{ 'active' if active == 'upload' }}">Upload</a>
      <a href="/invoices" class="{{ 'active' if active == 'list' }}">Invoices</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
